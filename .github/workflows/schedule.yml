name: Daily Instagram Trend Report

on:
  schedule:
    - cron: '30 0 * * *' # Runs at 6:00 AM IST (00:30 UTC) daily
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install apify-client requests

      - name: Run Trend Pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit new learned hashtags
        run: |
          git config --global user.name "TrendTracker-Bot"
          git config --global user.email "bot@trendtracker.com"
          git add bangali_creators.txt || true
          git commit -m "Auto-learn new hashtags [skip ci]" || echo "No changes to commit"
          git push || echo "Failed to push"
